[pytest]
testpaths = tests
addopts = -q

# Los tests importan `data_generation` y `src`, que cuelgan de la raiz del repo. Sin esto
# solo funciona `python -m pytest` (que mete el directorio actual en sys.path) y falla el
# `pytest` a secas, que es el que usa la CI y el que teclea cualquiera.
pythonpath = .
markers =
    slow: tests que generan el dataset a escala grande

# PySpark 3.5 sobre pandas 2.2 arrastra avisos de deprecacion de sus propias internas
# (distutils, is_categorical_dtype). No son accionables desde este repo y tapan la salida.
filterwarnings =
    ignore::DeprecationWarning:pyspark.*
    ignore::FutureWarning:pyspark.*
