name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyspark 3.5.x no soporta Python 3.13 todavia; fijamos 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # PySpark necesita una JVM (se usa a partir de la Fase 2).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Ejecutar tests
        run: pytest -q
